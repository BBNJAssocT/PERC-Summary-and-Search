name: Process new PDFs

# Runs every morning (about 5 AM Eastern) and whenever someone presses "Run workflow"
# on the Actions tab (works from the GitHub website or phone app).
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

# Never run two at once, and never cancel a run that is part-way through.
concurrency:
  group: process-new-pdfs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/requirements.txt

      - name: Install Python packages
        run: pip install -r cloud/requirements.txt

      # Always rebuilds the Word and PDF summaries, so removals and edits made in
      # Supabase show up too. No Claude usage is billed when nothing new is waiting.
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Process PDFs and rebuild summaries
        run: python cloud/cloud_process.py --rebuild
